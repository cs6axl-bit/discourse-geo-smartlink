plugins:
  geo_smartlink_enabled:
    default: true
  geo_smartlink_mmdb_path:
    default: "/shared/geo/dbip-country-lite.mmdb"
  geo_smartlink_default_country:
    default: "US"
  geo_smartlink_last_resort_country:
    default: ""
  geo_smartlink_fallback_url:
    default: "/"
  geo_smartlink_unavailable_enabled:
    default: true
  geo_smartlink_unavailable_use_ship_lists:
    default: false
  geo_smartlink_unavailable_max_cards:
    default: 6
    type: integer
